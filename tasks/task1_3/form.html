<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title> Task 1.3 </title>
</head>

<body>
    <form action="https://httpbin.io/dump/request" method="POST">
        <div class="form-group">
            <label for="nm"> Enter your name: </label>
            <input type="name" id="nm" name="name">
        </div>

        <div class="form-group">
            <label for="em"> Enter your email: </label>
            <input type="email" id="em" name="email">
        </div>

        <div class="form-group">
            <label for="DOB"> Enter your D.O.B: </label>
            <input type="date" id="DOB" name="DOB" min="1990-01-01" max="2026-11-09">
        </div>

        <div class="form-group">
            <label for="clrPkr"> Choose your favourit colour: </label>
            <input type="color" id="clrPkr" name="clrPkr">
        </div>

        <div class="form-group">
            <label for="role"> Select your role: </label>

            <input type="radio" id="staff" name="role" value="Staff">
            <label for="staff"> Staff </label>

            <input type="radio" id="student" name="role" value="Student">
            <label for="student"> Student </label>
        </div>

        <button type="submit"> Submit </button>
    </form>
</body>

</html>
